name: Dependency refresh (temporary)

on:
  push:
    branches:
      - gpt/production-failure-risk-audit

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/production-failure-risk-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Commit refreshed lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched transitive dependencies"
          git push origin HEAD:gpt/production-failure-risk-audit
