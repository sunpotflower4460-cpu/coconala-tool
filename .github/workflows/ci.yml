name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers (Chromium / WebKit)
        run: npx playwright install --with-deps chromium webkit

      # 型・単体・ビルド・E2E（偽楽天API＋実Worker、PC/タブレット/スマホ/iPhone、a11y、故障注入）・
      # 整合チェック・納品ZIP生成・ZIP展開後の再ビルドと静的版の動作確認を一括で実行する。
      - name: Verify all (quality gate + delivery package)
        run: npm run verify:all

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: |
            dist-delivery/VERIFICATION_REPORT.md
            dist-delivery/QUALITY_REPORT.md
            dist-delivery/release-check.json
            dist-delivery/delivery-verify.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload delivery package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-package
          path: dist-delivery/*.zip
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
