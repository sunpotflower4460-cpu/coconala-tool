name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 品質ゲート一式。デスクトップ版（Electron）の起動・Mac 用インストーラー（dmg）の作成が必要なため macOS で実行する。
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers (Chromium / WebKit)
        run: npx playwright install chromium webkit

      # 型・単体・ビルド・E2E（偽楽天API＋実Worker、PC/タブレット/スマホ/iPhone、a11y、故障注入）・
      # デスクトップ版のビルドと E2E・マニュアル生成・インストーラー作成（Mac / Windows）・
      # 整合チェック・納品ファイルの生成と再検証（作ったアプリの起動確認を含む）を一括で実行する。
      - name: Verify all (quality gate + delivery package)
        run: npm run verify:all

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: |
            dist-delivery/VERIFICATION_REPORT.md
            dist-delivery/QUALITY_REPORT.md
            dist-delivery/release-check.json
            dist-delivery/delivery-verify.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload delivery files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-files
          path: dist-delivery/納品ファイル-*/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Windows 用インストーラーを Windows で作り、実際に起動して、デスクトップ版の E2E を通す。
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build installer
        run: npm run dist:desktop:win

      - name: Launch the packaged app
        run: node scripts/desktop-package-smoke.mjs release-desktop/win-unpacked/SobaCardBoard.exe

      - name: Desktop E2E
        run: npx playwright test --config playwright.desktop.config.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
